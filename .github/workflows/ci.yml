name: contracts

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: forge fmt --check

      - run: npx solhint 'src/**/*.sol' --max-warnings 0

      - run: forge build --sizes

      - run: forge test -vvv
